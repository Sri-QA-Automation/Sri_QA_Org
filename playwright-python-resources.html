<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playwright with Python Study Material | Sri QA Academy</title>
  <meta name="description" content="Notes, assignments, training material and 100 interview questions for the Playwright with Python course at Sri QA Academy." />
  <link rel="canonical" href="https://sriqaacademy.org/playwright-python-resources.html" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px}
    .tab{background:var(--white);color:var(--dark);border:2px solid var(--primary);border-radius:999px;padding:10px 22px;font-weight:600;cursor:pointer;font-size:1rem}
    .tab.on,.tab:hover{background:var(--primary);color:var(--white)}
    .panel{display:none}.panel.on{display:block}
    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
    .card h3{margin-bottom:8px;font-size:1.05rem}
    .num{display:inline-block;background:var(--primary);color:#fff;border-radius:999px;font-size:.8rem;padding:2px 10px;margin-bottom:8px}
    .tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .tools input,.tools select{padding:10px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:1rem;flex:1;min-width:200px}
    .qa-cat{margin:22px 0 10px;color:var(--primary-dark)}
    .qa details{background:var(--white);padding:14px 18px;border-radius:10px;margin-bottom:10px;box-shadow:var(--shadow)}
    .qa summary{cursor:pointer;font-weight:600;color:var(--dark)}
    .qa p{margin-top:8px}
    .count{color:var(--text);margin-bottom:8px}
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo" aria-label="Sri QA Academy home"><img src="logo.png" alt="Sri QA Academy logo" class="logo-img" onerror="this.outerHTML='<span class=logo-mark>Sri<br>QA</span>'" /><span class="logo-text">Sri QA Academy</span></a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
      <nav id="navLinks">
        <a href="index.html">Home</a>
        <a href="index.html#courses">All Courses</a>
        <a href="playwright-python-course.html">Course Page</a>
        <a href="playwright-python-course.html#contact" class="btn btn-small">Free Demo</a>
      </nav>
    </div>
  </header>

  <section class="hero page-hero">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <a href="playwright-python-course.html">Playwright with Python</a> / <span>Study Material</span></nav>
      <h1>Playwright with Python <span>Study Material</span></h1>
      <p>Notes, assignments, training material and 100 interview questions for our students.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="tabs" role="tablist">
        <button class="tab on" data-p="notes">Notes</button>
        <button class="tab" data-p="assign">Assignments</button>
        <button class="tab" data-p="material">Training Material</button>
        <button class="tab" data-p="qa">Interview Questions (100)</button>
      </div>
      <div id="notes" class="panel on"><div class="grid2" id="notesList"></div></div>
      <div id="assign" class="panel"><div class="grid2" id="assignList"></div></div>
      <div id="material" class="panel"><div class="grid2" id="matList"></div></div>
      <div id="qa" class="panel">
        <div class="tools"><input id="q" type="search" placeholder="Search questions..." aria-label="Search questions" /><select id="cat" aria-label="Category"></select></div>
        <div class="count" id="count"></div>
        <div class="qa" id="qaList"></div>
      </div>
    </div>
  </section>

  <footer class="footer"><div class="container"><p>&copy; <span id="year"></span> Sri QA Academy. <a href="playwright-python-course.html">Back to course page</a></p></div></footer>

  <script src="playwright-python-resources.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    $("year").textContent = new Date().getFullYear();
    const nav = $("navLinks");
    $("menuToggle").addEventListener("click", () => nav.classList.toggle("open"));

    // Tabs, with #notes / #assign / #material / #qa deep links
    function show(id) {
      if (!$(id) || !$(id).classList.contains("panel")) id = "notes";
      document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === id));
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.p === id));
    }
    document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { show(t.dataset.p); history.replaceState(null, "", "#" + t.dataset.p); }));
    show(location.hash.slice(1));

    $("notesList").innerHTML = NOTES.map((n, i) => `<div class="card"><span class="num">Topic ${i + 1}</span><h3>${esc(n[0])}</h3><p>${esc(n[1])}</p></div>`).join("");
    $("assignList").innerHTML = ASSIGN.map((a, i) => `<div class="card"><span class="num">Assignment ${i + 1}</span><h3>${esc(a[0])}</h3><p>${esc(a[1])}</p></div>`).join("");
    $("matList").innerHTML = MATERIAL.map(m => `<div class="card"><h3>${esc(m[0])}</h3><p><strong>${esc(m[1])}</strong></p><p>${esc(m[2])}</p></div>`).join("");

    // Interview questions
    const all = [];
    let n = 0;
    for (const c in QA) QA[c].forEach(s => { const [q, a] = s.split("|"); all.push({ c, q, a, n: ++n }); });
    $("cat").innerHTML = '<option value="">All categories</option>' + Object.keys(QA).map(c => `<option>${esc(c)}</option>`).join("");
    function render() {
      const t = $("q").value.toLowerCase(), c = $("cat").value;
      const list = all.filter(x => (!c || x.c === c) && (!t || (x.q + " " + x.a).toLowerCase().includes(t)));
      let last = "", html = "";
      list.forEach(x => {
        if (x.c !== last) { html += `<h3 class="qa-cat">${esc(x.c)}</h3>`; last = x.c; }
        html += `<details><summary>${x.n}. ${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`;
      });
      $("qaList").innerHTML = html || "<p>No questions match your search.</p>";
      $("count").textContent = list.length + " of " + all.length + " questions";
    }
    $("q").addEventListener("input", render);
    $("cat").addEventListener("change", render);
    render();
  </script>
</body>
</html>
